line-length = 100
target-version = "py311"

[lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # 行长度由 formatter 处理
    "B008",  # 允许在参数默认值中使用函数调用（FastAPI Depends 需要）
]

[format]
quote-style = "double"
indent-style = "space"
