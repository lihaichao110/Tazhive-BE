[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[project]
name = "TaiWisHub"
version = "0.1.0"
requires-python = ">=3.10"
description = "泰智汇"
dependencies = [
    "alembic>=1.19.1",
    "fastapi>=0.141.1",
    "langchain>=1.3.17",
    "langchain-anthropic>=1.6.1",
    "langchain-community>=0.4.2",
    "langchain-openai>=1.6.0",
    "langgraph>=1.2.11",
    "langgraph-checkpoint-postgres>=3.1.2",
    "pgvector>=0.5.0",
    "psycopg2-binary>=2.9.12",
    "psycopg[binary]>=3.3.4",
    "pydantic[email]>=2.13.4",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.2",
    "python-jose[cryptography]>=3.5.0",
    "slowapi>=0.1.10",
    "sqlmodel>=0.0.42,<0.1.0",
    "tenacity>=9.1.4",
    "uvicorn[standard]>=0.52.4",
    "bcrypt>=5.0.0",
    "psycopg-pool>=3.3.1",
    "langchain-deepseek>=1.1.0",
    "langchain-core>=1.6.0",
    "logger>=1.4",
]
authors = [
    { name = "lihaichao", email = "17645103861@163.com" },
]
readme = "README.md"

[dependency-groups]
dev = [
    "black>=26.5.1",
    "ipython>=8.39.0",
    "pytest>=9.1.1",
    "pytest-mock>=3.15.1",
]

[tool.codespell]
ignore-words-list = "llm"
